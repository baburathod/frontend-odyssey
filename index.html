<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Life of a Developer — Frontend Odyssey</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{
  --bg:#07070c;--surface:#0f0f18;--green:#00ff88;--amber:#ffb800;
  --red:#ff4455;--blue:#44aaff;--purple:#a855f7;--text:#e8e8f2;
  --muted:#4a4a68;--border:#18182a;
  --mono:'Space Mono',monospace;--display:'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);overflow-x:hidden;cursor:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--green)}
#cursor{position:fixed;width:10px;height:10px;background:var(--green);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
#cursor-ring{position:fixed;width:32px;height:32px;border:1px solid var(--green);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);opacity:.35;transition:transform .15s,opacity .15s}
#progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--green),var(--amber),var(--purple));z-index:9000;width:0}
#threejs-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
#loader{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem}
.loader-logo{font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--green)}
.loader-logo span{color:var(--text)}
#lottie-wrap{width:72px;height:72px}
.loader-track{width:260px;height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber));width:0;border-radius:2px;transition:width .35s ease}
.loader-msg{font-size:.68rem;color:var(--muted);letter-spacing:.1em;min-height:1.2rem;text-align:center}
nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:1rem 3rem;display:flex;align-items:center;justify-content:space-between;background:rgba(7,7,12,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--display);font-weight:900;font-size:1rem;color:var(--green)}
.nav-logo span{color:var(--text)}
.nav-links{display:flex;gap:1.8rem}
.nav-links a{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-decoration:none;transition:color .2s;cursor:none}
.nav-links a:hover{color:var(--green)}
section{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:6rem 2rem;z-index:1}
/* TICKER — CSS Animation 1 */
.ticker-wrap{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.65rem 0;background:var(--surface);position:relative;z-index:2}
.ticker{display:flex;gap:3rem;white-space:nowrap;animation:tick 28s linear infinite}
.ticker-item{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);flex-shrink:0}
.ticker-item b{color:var(--green);margin-right:.5rem}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* HERO */
#hero{flex-direction:column;text-align:center;background:radial-gradient(ellipse 80% 55% at 50% 0%,#0d2b1a,transparent 65%)}
.hero-tag{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border);border-radius:100px;padding:.32rem 1rem;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2rem;background:var(--surface)}
/* CSS Animation 2 — pulse */
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
.hero-title{font-family:var(--display);font-weight:900;font-size:clamp(3rem,9vw,8.5rem);line-height:.92;letter-spacing:-.04em}
.hero-title .t1{display:block;color:var(--text)}
.hero-title .t2{display:block;color:var(--green)}
.hero-title .t3{display:block;color:var(--muted);font-size:.33em;letter-spacing:.1em;margin-top:.6rem;font-weight:400}
.hero-sub{margin-top:1.8rem;font-size:.82rem;color:var(--muted)}
/* CSS Animation 3 — glitch */
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;clip-path:polygon(0 30%,100% 30%,100% 55%,0 55%)}
.glitch::before{color:var(--red);transform:translateX(-3px);animation:g1 4s infinite}
.glitch::after{color:var(--blue);transform:translateX(3px);animation:g2 4s infinite}
@keyframes g1{0%,89%,100%{transform:translateX(-3px);clip-path:polygon(0 30%,100% 30%,100% 55%,0 55%)}91%{transform:translateX(3px);clip-path:polygon(0 60%,100% 60%,100% 75%,0 75%)}94%{transform:translateX(0)}}
@keyframes g2{0%,87%,100%{transform:translateX(3px);clip-path:polygon(0 45%,100% 45%,100% 65%,0 65%)}90%{transform:translateX(-3px);clip-path:polygon(0 20%,100% 20%,100% 45%,0 45%)}93%{transform:translateX(0)}}
/* CSS Animation 4 — scroll arrow */
.scroll-hint{position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;font-size:.6rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,var(--muted),transparent);animation:scrollA 1.6s ease-in-out infinite}
@keyframes scrollA{0%,100%{opacity:.3;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.4)}}
.bg-code{position:absolute;font-size:.66rem;font-family:var(--mono);color:rgba(255,255,255,.04);pointer-events:none;user-select:none}
/* SECTION COMMONS */
.sec-inner{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center}
.sec-label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:.9rem;display:flex;align-items:center;gap:.6rem}
.sec-label::before{content:'';width:28px;height:1px;background:var(--green);flex-shrink:0}
.sec-heading{font-family:var(--display);font-size:clamp(1.9rem,4vw,3.4rem);font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:1.3rem}
.sec-heading em{font-style:normal;color:var(--amber)}
.sec-body{font-size:.82rem;line-height:2;color:#7a7a95;margin-bottom:1.8rem}
/* Code window */
.code-win{background:#0a0a14;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.6)}
.code-bar{background:#121220;padding:.75rem 1rem;display:flex;align-items:center;gap:.45rem;border-bottom:1px solid var(--border)}
.cdot{width:9px;height:9px;border-radius:50%}.cdr{background:var(--red)}.cdy{background:var(--amber)}.cdg{background:var(--green)}
.code-bar-title{font-size:.63rem;color:var(--muted);margin:0 auto}
.code-body{padding:1.4rem;font-size:.75rem;line-height:1.9}
.kw{color:#c792ea}.str{color:var(--amber)}.cm{color:var(--muted);font-style:italic}.tg{color:var(--green)}.fn{color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:.45rem}
.tag{padding:.28rem .75rem;border:1px solid var(--border);border-radius:2px;font-size:.68rem;color:var(--muted);transition:all .2s;cursor:none}
.tag:hover{border-color:var(--amber);color:var(--amber)}
/* DEBUGGING */
#debugging{background:radial-gradient(ellipse 90% 70% at 50% 50%,#160810,var(--bg) 70%);flex-direction:column}
.err-term{background:#0a0a14;border:1px solid rgba(255,68,85,.2);border-radius:10px;overflow:hidden;margin-top:2.4rem}
.err-row{display:flex;padding:.55rem 1.4rem;font-size:.74rem;line-height:1.6;border-bottom:1px solid rgba(255,68,85,.05);gap:1rem}
.err-row .ln{color:var(--muted);min-width:22px;text-align:right}
.et{color:var(--red)}.ef{color:var(--amber)}.en{color:var(--blue)}.eo{color:var(--green)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.3rem;margin-top:2rem}
.s-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.4rem;text-align:center;opacity:0}
.s-num{font-family:var(--display);font-size:2.3rem;font-weight:900;display:block}
.s-lbl{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:.3rem}
/* DEADLINES */
#deadlines{background:linear-gradient(180deg,var(--bg) 0%,#080f06 100%)}
.timeline{position:relative;max-width:660px;width:100%;padding-left:2rem}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--green),var(--amber),var(--red),transparent)}
.tl-item{position:relative;padding:0 0 2.8rem 2.4rem;opacity:0}
.tl-item::before{content:'';position:absolute;left:-5px;top:6px;width:11px;height:11px;border-radius:50%;border:2px solid var(--green);background:var(--bg)}
.tl-time{font-size:.62rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:.35rem}
.tl-title{font-family:var(--display);font-size:1.25rem;font-weight:700;margin-bottom:.4rem}
.tl-desc{font-size:.77rem;color:#70709a;line-height:1.88}
.coffee-col{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem}
/* CSS Animation 5 — steam */
.coffee-cup{font-size:3.5rem;animation:steam 2.2s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.c-bar{width:7px;height:130px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.c-fill{position:absolute;bottom:0;width:100%;background:linear-gradient(to top,#5a2e10,var(--amber));border-radius:4px;height:10%;transition:height .3s}
.c-lbl{font-size:.6rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;writing-mode:vertical-lr}
/* INSIGHT */
#insight{background:radial-gradient(ellipse 100% 80% at 50% 50%,#081428,var(--bg) 75%);flex-direction:column}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;max-width:1000px;width:100%;margin-top:2.8rem}
.i-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:2rem 1.5rem;cursor:none;transition:border-color .3s,transform .3s,box-shadow .3s;opacity:0}
.i-card:hover{border-color:var(--green);transform:translateY(-5px);box-shadow:0 0 40px rgba(0,255,136,.07)}
.i-icon{font-size:2rem;margin-bottom:1rem;display:block}
/* CSS Animation 6 — float */
.i-icon{animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.i-title{font-family:var(--display);font-size:1.1rem;font-weight:700;margin-bottom:.65rem}
.i-text{font-size:.77rem;color:#72729a;line-height:1.88}
/* CONCLUSION */
#conclusion{background:radial-gradient(ellipse 80% 60% at 50% 100%,#0d2b1a,var(--bg) 70%);flex-direction:column;text-align:center}
.c-title{font-family:var(--display);font-size:clamp(2.5rem,7vw,6.5rem);font-weight:900;line-height:.95;letter-spacing:-.04em;opacity:0}
.c-title span{color:var(--green)}
.c-sub{margin-top:1.4rem;font-size:.82rem;color:var(--muted);max-width:480px;line-height:1.9;opacity:0}
.btn-row{display:flex;gap:1rem;margin-top:2.8rem;justify-content:center;flex-wrap:wrap;opacity:0}
.btn{padding:.85rem 2rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;cursor:none;text-decoration:none;transition:all .2s;display:inline-block;border:1px solid transparent}
.btn-p{background:var(--green);color:#000;font-weight:700;border-color:var(--green)}
.btn-p:hover{background:transparent;color:var(--green)}
.btn-o{background:transparent;color:var(--text);border-color:var(--border)}
.btn-o:hover{border-color:var(--text)}
.final-term{margin-top:3rem;font-size:.73rem;color:var(--muted);text-align:left;display:inline-block;opacity:0}
.final-term span{display:block;margin-bottom:.2rem}
.ft-ok{color:var(--green)}.ft-w{color:var(--amber)}
/* CSS Animation 7 — blink */
.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
/* Tech badges */
.tech-strip{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:2rem}
.tech-badge{font-size:.58rem;padding:.22rem .6rem;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.tb-gsap{background:rgba(136,206,2,.12);color:#88ce02;border:1px solid rgba(136,206,2,.25)}
.tb-three{background:rgba(0,168,255,.12);color:#00a8ff;border:1px solid rgba(0,168,255,.25)}
.tb-lottie{background:rgba(255,184,0,.12);color:var(--amber);border:1px solid rgba(255,184,0,.25)}
.tb-react{background:rgba(97,218,251,.12);color:#61dafb;border:1px solid rgba(97,218,251,.25)}
.tb-css{background:rgba(0,255,136,.12);color:var(--green);border:1px solid rgba(0,255,136,.25)}
/* Reveal helpers — initial hidden states for GSAP */
.reveal{opacity:0;transform:translateY(28px)}
.reveal-x{opacity:0;transform:translateX(60px)}
/* Responsive */
@media(max-width:900px){nav{padding:1rem 1.5rem}.nav-links{display:none}.sec-inner{grid-template-columns:1fr;gap:2.5rem}.stats-row{grid-template-columns:1fr 1fr}.cards-grid{grid-template-columns:1fr}.coffee-col{display:none}}
@media(max-width:600px){section{padding:5rem 1.2rem}.stats-row{grid-template-columns:1fr}.btn-row{flex-direction:column;align-items:center}}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="progress"></div>
<canvas id="threejs-bg"></canvas>

<!-- Loader -->
<div id="loader">
  <div class="loader-logo">DEV<span>.LIFE</span></div>
  <div id="lottie-wrap"></div>
  <div class="loader-track"><div class="loader-fill" id="loaderFill"></div></div>
  <div class="loader-msg" id="loaderMsg">Initializing…</div>
</div>

<!-- React root -->
<div id="root"></div>

<!-- =============================================
     VANILLA JS  (runs immediately, no React needed)
============================================= -->
<script>
// ── THREE.JS background ──
(function(){
  var canvas = document.getElementById('threejs-bg');
  var renderer = new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
  camera.position.z = 5;
  var count = 200;
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count*3);
  for(var i=0;i<count;i++){pos[i*3]=(Math.random()-.5)*20;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=(Math.random()-.5)*10;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var mat = new THREE.PointsMaterial({color:0x00ff88,size:.045,transparent:true,opacity:.6,sizeAttenuation:true});
  var pts = new THREE.Points(geo,mat);
  scene.add(pts);
  var sGeo = new THREE.SphereGeometry(2.8,18,18);
  var sMat = new THREE.MeshBasicMaterial({color:0x00ff88,wireframe:true,transparent:true,opacity:.03});
  scene.add(new THREE.Mesh(sGeo,sMat));
  var dmx=0,dmy=0,sy=0;
  document.addEventListener('mousemove',function(e){dmx=(e.clientX/innerWidth-.5)*.4;dmy=(e.clientY/innerHeight-.5)*.4;});
  window.addEventListener('scroll',function(){sy=window.scrollY;});
  var clock = new THREE.Clock();
  var cols=[0x00ff88,0xffb800,0xff4455,0x44aaff,0xa855f7,0x00ff88];
  (function loop(){
    requestAnimationFrame(loop);
    var t=clock.getElapsedTime();
    pts.rotation.y=t*.025+dmx; pts.rotation.x=t*.012+dmy;
    var p=sy/(document.documentElement.scrollHeight-innerHeight)||0;
    mat.color.setHex(cols[Math.min(Math.floor(p*(cols.length-1)),cols.length-1)]);
    renderer.render(scene,camera);
  })();
  window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();

// ── LOTTIE loader animation ──
var lottieAnim = lottie.loadAnimation({
  container: document.getElementById('lottie-wrap'),
  renderer: 'svg', loop: true, autoplay: true,
  animationData: {"v":"5.7.4","fr":30,"ip":0,"op":60,"w":72,"h":72,"nm":"Spin","ddd":0,"assets":[],
    "layers":[{"ddd":0,"ind":1,"ty":4,"nm":"R","sr":1,
      "ks":{"o":{"a":0,"k":100},"r":{"a":1,"k":[{"i":{"x":[.5],"y":[1]},"o":{"x":[.5],"y":[0]},"t":0,"s":[0]},{"t":60,"s":[360]}]},
        "p":{"a":0,"k":[36,36,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":0,"k":[100,100,100]}},
      "ao":0,"shapes":[
        {"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[48,48]},"nm":"E"},
        {"ty":"st","c":{"a":1,"k":[{"i":{"x":[.5],"y":[1]},"o":{"x":[.5],"y":[0]},"t":0,"s":[0,1,.533,1]},{"i":{"x":[.5],"y":[1]},"o":{"x":[.5],"y":[0]},"t":30,"s":[1,.722,0,1]},{"t":60,"s":[0,1,.533,1]}]},
          "o":{"a":0,"k":100},"w":{"a":0,"k":3},"lc":2,"lj":2,"nm":"S"},
        {"ty":"tm","s":{"a":0,"k":10},"e":{"a":1,"k":[{"i":{"x":[.5],"y":[1]},"o":{"x":[.5],"y":[0]},"t":0,"s":[15]},{"i":{"x":[.5],"y":[1]},"o":{"x":[.5],"y":[0]},"t":30,"s":[85]},{"t":60,"s":[15]}]},"o":{"a":0,"k":0},"nm":"T"}
      ],"ip":0,"op":60,"st":0}]}
});

// ── LOADER ──
var MSGS=['npm install life --save','Resolving dependencies...','Installing impostor_syndrome@latest','WARNING: sleep.js deprecated','Loading Three.js universe... ✓','Lottie animations ready... ✓','Brewing coffee.js... ✓','Ready. Ship it.'];
var ldx=0;
var fillEl=document.getElementById('loaderFill');
var msgEl=document.getElementById('loaderMsg');
var ldInt=setInterval(function(){
  ldx++;
  msgEl.textContent=MSGS[Math.min(ldx,MSGS.length-1)];
  fillEl.style.width=(ldx/MSGS.length*100)+'%';
  if(ldx>=MSGS.length){
    clearInterval(ldInt);
    setTimeout(function(){
      lottieAnim.stop();
      var l=document.getElementById('loader');
      l.style.transition='opacity .6s';
      l.style.opacity='0';
      setTimeout(function(){l.style.display='none';},600);
    },350);
  }
},280);

// ── CURSOR ──
var cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
var mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
(function ac(){cur.style.left=mx+'px';cur.style.top=my+'px';rx+=(mx-rx)*.1;ry+=(my-ry)*.1;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ac);})();
document.addEventListener('mouseover',function(e){
  var o=e.target.closest('a,button,.i-card,.tl-item,.tag,.btn');
  cur.style.width=o?'18px':'10px';cur.style.height=o?'18px':'10px';
  ring.style.opacity=o?'.75':'.35';ring.style.transform=o?'translate(-50%,-50%) scale(1.7)':'translate(-50%,-50%) scale(1)';
});

// ── PROGRESS ──
window.addEventListener('scroll',function(){
  document.getElementById('progress').style.width=(window.scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%';
});
</script>

<!-- =============================================
     REACT + JSX via Babel
     GSAP animations run AFTER React mounts via useEffect
============================================= -->
<script type="text/babel">
var _useEffect  = React.useEffect;
var _useRef     = React.useRef;
var _useState   = React.useState;

// Register GSAP plugin once
gsap.registerPlugin(ScrollTrigger);

// ─────────────────────────────
// GSAP helper — safe scroll anim
// called from useEffect so DOM exists
// ────────────────────
